[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Solar (https://github.com/paradigmxyz/solar), pinned: forge installs it
solc = "solar:0.3.1"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
# tests.json is read and parsed by the tests
fs_permissions = [{ access = "read", path = "./data" }]
gas_limit = "18446744073709551615"
memory_limit = 1073741824

# every known ENS label vs the reference implementation: bun scripts/labels.ts, then FOUNDRY_PROFILE=exhaustive forge test
[profile.exhaustive]
test = "labels"
